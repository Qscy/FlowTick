<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0891b2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 背景环 -->
  <circle cx="16" cy="16" r="13" stroke="url(#g)" stroke-width="2.5" fill="none" opacity="0.15" filter="url(#glow)"/>

  <!-- 进度弧 -->
  <circle cx="16" cy="16" r="13" stroke="url(#g)" stroke-width="2.5" fill="none" stroke-dasharray="61 21" stroke-linecap="round" transform="rotate(-90 16 16)"/>

  <!-- 声波 -->
  <line x1="13" y1="14" x2="13" y2="18" stroke="url(#g)" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="12" x2="16" y2="20" stroke="url(#g)" stroke-width="2" stroke-linecap="round"/>
  <line x1="19" y1="14" x2="19" y2="18" stroke="url(#g)" stroke-width="2" stroke-linecap="round"/>
</svg>
